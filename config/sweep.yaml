program: train_unified.py
method: bayes
metric:
  name: val_loss
  goal: minimize

parameters:
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.001

  section_loss_weight:
    distribution: log_uniform_values
    min: 1.0
    max: 20.0

  conv_filters:
    values: [3, 5, 7, 9]

early_terminate:
  type: hyperband
  min_iter: 30
  eta: 2
  s: 3

# Run configuration
command:
  - ${env}
  - python3
  - -m
  - midi_msa.train_unified
  - ${args_no_hyphens}