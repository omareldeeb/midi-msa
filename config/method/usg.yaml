# @package _global_
method: usg

# Training parameters
batch_size: 32
num_epochs: 50
lr: 1e-3
weight_decay: 1e-4
early_stopping_patience: 10

# USG-specific data parameters
window_half_ticks: 256
positive_oversampling_factor: 2
negative_undersampling_factor: 1
pad_boundary_patches: true
patch_normalize: false

# USG-specific model parameters
pretrained: false
output_features: 64
num_targets: 1

# Multi-task learning
predict_segment_label: false
segment_label_loss_weight: 1.0

# Data format (for auto-creation if data_dir doesn't exist)
# OLD FORMAT: requires markers_qn_path, measures_qn_path
# NEW FORMAT: requires annotation_dir only (in main config)
markers_qn_path: /Users/omar/Documents/Projects/midi-msa/slms_metadata/markers_qn.json  # Old format only: markers_qn.json path
measures_qn_path: /Users/omar/Documents/Projects/midi-msa/slms_metadata/measures_qn.json  # Optional: measures_qn.json path
