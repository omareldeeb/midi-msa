# @package _global_
method: usg

# Training parameters
batch_size: 32
num_epochs: 50
lr: 1e-3
weight_decay: 1e-4
early_stopping_patience: 10

# USG-specific data parameters
window_half_ticks: 256
positive_oversampling_factor: 2
negative_undersampling_factor: 1
pad_boundary_patches: true
patch_normalize: false

# USG-specific model parameters
usg_architecture: usg_original  # usg_original (Grill & Schlueter 2015 model D) or mobilenet
usg_patch_freq_bins: 128
pretrained: true
output_features: 64
dropout_rate: 0.2
num_targets: 1

# Multi-task learning
compute_segment_labels: true
segment_label_loss_weight: 0.25
