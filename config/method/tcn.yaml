# @package _global_
method: tcn

# TCN uses batch size 1 by default
num_epochs: 50
lr: 1e-3
weight_decay: 1e-4
early_stopping_patience: 10

# TCN model parameters
tcn_layers: 2
tcn_kernel_size: 5
conv_filters: 20

# Task configuration
compute_beats: false
compute_downbeats: false
compute_segments: true

# Loss weights
beat_loss_weight: 1.0
downbeat_loss_weight: 3.0
section_loss_weight: 10.0
function_loss_weight: 1.0
