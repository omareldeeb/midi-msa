defaults:
  - method: tcn
  - _self_

# Data paths
midi_dir: /Users/omar/Projects/ComposersAssistant/lmd_full
annotation_dir: /Users/omar/Documents/Projects/midi-msa/slms_data/v1.1.1  # If provided for USG, overrides markers_qn_path and measures_qn_path (new format); required for TCN
# Optional cache paths
piano_roll_dir: /Volumes/ExtremePro/piano_roll_dir
sslm_dir: /Volumes/ExtremePro/sslm_dir

# Piano roll parameters
target_ticks_per_beat: 4
instrument_overtones: true
separate_drums: true
transpose_augmentation: true

# SSLM parameters
use_sslm_near: true
use_sslm_far: true

# Device and paths
device: auto # "auto", "cpu", "cuda", or "mps"
checkpoint_dir: checkpoints
log_dir: runs

# Training
save_every: 10
clip_norm: 1.0

# Cross-validation
split_files: ["/Users/omar/Downloads/cv_split_files/cv_split_0.json"]
val_split: null

# Logging
wandb:
  enabled: false
  project: null
  entity: null
  name: null
  tags: []

# System
num_workers: 4
seed: null
resume: false
