defaults:
  - method: tcn
  - _self_

# Data paths
annotation_dir: /Users/omar/Documents/Projects/midi-msa/slms_data/v1.1.1
midi_dir: /Users/omar/Projects/ComposersAssistant/lmd_full

# Piano roll parameters
target_ticks_per_beat: 4
instrument_overtones: true
separate_drums: true

# Training parameters
batch_size: 1
num_epochs: 50
lr: 1e-3
weight_decay: 1e-4

# Device and paths
device: auto # "auto", "cpu", "cuda", or "mps"
checkpoint_dir: checkpoints
log_dir: runs

# Cross-validation
split_files: null
val_split: 0.1

# Logging
wandb:
  enabled: false
  project: null
  entity: null
  name: null
  tags: []

# System
num_workers: 4
seed: null
resume: false
